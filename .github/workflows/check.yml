name: Check client
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Reproduce public capability search benchmark
        run: python benchmark/run_benchmark.py --engine benchmark/capability_search.py --output benchmark/replayed-report.json
      - name: Compare reproduced report with committed results
        run: python -c "from pathlib import Path; assert Path('benchmark/replayed-report.json').read_bytes() == Path('benchmark/report.json').read_bytes(), 'Benchmark report changed; inspect the rankings and publish updated results'"
      - name: Test benchmark scoring
        run: python -m unittest discover -s benchmark -p test_benchmark.py -v
      - name: Test prospective evaluation without running frozen queries
        run: python -m unittest discover -s benchmark/prospective-evaluation -p test_evaluate.py -v
      - name: Test public report reproduction
        run: python -m unittest discover -s research -p test_reproduction.py -v
      - name: Test publisher-authorized synthetic fixtures
        run: python -m unittest discover -s testing -p test_capability_tests.py -v

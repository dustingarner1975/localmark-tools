[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localmark-client"
version = "0.4.0"
description = "Read-only Python client for LocalMark agent evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LocalMark"}]
dependencies = []

[project.scripts]
localmark = "localmark_client.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["localmark_client"]
namespaces = false
